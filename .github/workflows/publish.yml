name: publish

# Publishes to npm when a version tag (v1.2.3) is pushed.
# Authentication: npm trusted publishing (OIDC). No long-lived npm token is stored anywhere.
# Provenance: generated automatically, linking the published package to this workflow run.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No `registry-url` here on purpose: it writes an `_authToken=${NODE_AUTH_TOKEN}` line to
      # .npmrc, npm then believes auth is configured and never tries OIDC (actions/setup-node#1551).
      # npm already defaults to https://registry.npmjs.org.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check npm supports trusted publishing (>= 11.5.1)
        run: |
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error('npm '+process.argv[1]+' is too old for trusted publishing'); process.exit(1) }" "$(npm -v)"
      - name: Tag matches package.json version
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME" \
            || { echo "Tag $GITHUB_REF_NAME does not match package.json version"; exit 1; }
      - run: npm test
      - run: npm publish
